name: Release

# Manual: Actions → Release → Run workflow. With pending changesets it opens the "Version packages"
# PR; with none it stages any version not yet on npm, through npm trusted publishing (OIDC), so no
# npm token is stored anywhere. A maintainer then approves each staged version on npmjs.com with 2FA.
# Each package's trusted publisher is this repo, release.yml and the npm environment, with
# "Allow npm publish" off.
on:
  workflow_dispatch:

concurrency: release

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: write        # version commits and tags
      pull-requests: write   # the "Version packages" PR
      id-token: write        # npm trusted publishing and provenance (OIDC, no long-lived token)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Create the release PR, or publish when it merges
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
