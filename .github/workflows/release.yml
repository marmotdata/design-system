name: Release

# Push a tag to release every package at that version, like the Marmot SDK:
#
#   pnpm bump 0.1.1 && git commit -am "chore: release 0.1.1" && git tag v0.1.1 && git push --follow-tags
#
# Packages are staged on npm through trusted publishing (OIDC), so no token is stored anywhere; a
# maintainer then approves each staged version on npmjs.com with 2FA. Each package's trusted
# publisher is this repo, release.yml and the npm environment, with "Allow npm publish" off.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency: release

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/org/marmotdata
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag matches every package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          for f in packages/*/package.json; do
            node -e "const p=require('./$f'); if (!p.private && p.version !== '$want') { console.error(p.name + ' is ' + p.version + ', tag is $want'); process.exit(1) }"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - name: Stage on npm
        run: pnpm release
