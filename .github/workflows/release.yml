name: Release

# Manual only until npm publishing is set up and agreed: Actions → Release → Run workflow.
on:
  workflow_dispatch:

concurrency: release

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # version commits and tags
      pull-requests: write   # the "Version packages" PR
      id-token: write        # npm trusted publishing and provenance (OIDC, no long-lived token)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter="./packages/*"
      - name: Create the release PR, or publish when it merges
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
