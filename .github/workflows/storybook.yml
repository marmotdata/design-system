name: Deploy Storybook

# The public Storybook build to storybook.marmot.team (a static Worker behind the marmot.team
# Access application) on every push to main. The token is the repository secret
# CLOUDFLARE_STORYBOOK_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, the newest winning.
concurrency:
  group: storybook
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm turbo run build --filter="./packages/*"
      - name: Build Storybook
        working-directory: apps/storybook
        run: pnpm build:public
      - name: Deploy
        working-directory: apps/storybook
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STORYBOOK_TOKEN }}
